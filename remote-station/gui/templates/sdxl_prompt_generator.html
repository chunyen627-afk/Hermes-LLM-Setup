// ── State ─────────────────────────────────────────────────────
const state = {};       // { 'catIdx|tagIdx': {checked, weight} }
let activePreset = '';  // store preset content so it survives generate calls

function key(ci, ti) { return `${ci}|${ti}`; }

// ── Build categories UI ──────────────────────────────────────
const catNames = Object.keys(TAGS);

catNames.forEach((catName, ci) => {
  const tags = TAGS[catName];
  tags.forEach((_, ti) => { state[key(ci, ti)] = { checked: false, weight: 1.0 }; });

  const details = document.createElement('details');
  details.className = 'bg-white rounded-lg shadow overflow-hidden transition-all';
  details.open = false;

  const summary = document.createElement('summary');
  summary.className = 'flex items-center justify-between cursor-pointer p-3 font-semibold text-gray-800 select-none hover:bg-gray-100';
  summary.innerHTML = `<span class="text-base">📂 ${catName}</span>
    <svg class="chevron w-4 h-4 transition-transform duration-200 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>`;

  // ── Special: Age category → big slider 1-99 ──

    const ageBox = document.createElement('div');

      <label class="text-sm text-gray-500 font-medium">選擇人物年齡</label>

      <div class="text-center">
          <span class="text-5xl font-extrabold text-purple-700" id="ageValue">10</span>
        <span class="text-xl text-gray-400 ml-2">歲 / years old</span>
      </div>
      <p class="text-xs text-gray-400 text-center">拖曳調整年齡，生成時自動帶入 <code id="ageHint">(age_10)</code></p>`;
    details.appendChild(ageBox);

    const slider = ageBox.querySelector('#ageSlider');
    const display = ageBox.querySelector('#ageValue');
    const hint = ageBox.querySelector('#ageHint');
    slider.oninput = () => {
      const v = slider.value;
      display.textContent = v;
      hint.textContent = `(age_${v})`;
    };
  } else {
    // ── Normal category: checkbox rows ──
    const grid = document.createElement('div');
    grid.className = 'p-3 pt-0 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-1';

    grid.style.overflowY = 'auto';

    tags.forEach(([fullLabel, defaultWeight], ti) => {
      const row = document.createElement('label');
      row.className = 'tag-row flex items-center gap-2 px-2 py-1 rounded cursor-pointer text-xs';

      const id = `t${ci}_${ti}`;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = id;
      cb.className = 'w-4 h-4 text-purple-600 rounded focus:ring-purple-500 cursor-pointer flex-shrink-0';
      cb.onchange = () => { state[key(ci, ti)].checked = cb.checked; updateCount(); };

      const wl = document.createElement('span');

// ── Update count ──────────────────────────────────────────────
function updateCount() {
  let n = 0;
  Object.values(state).forEach(s => { if (s.checked) n++; });
  document.getElementById('promptCount').textContent = `已選 ${n} 個 tag`;
}

// ── Generate prompt ──────────────────────────────────────────
function generatePrompt() {
  const baseParts = activePreset ? activePreset.split(',').map(s => s.trim()).filter(s => s) : [];

  const extraParts = [];

  const ageCatIdx = catNames.findIndex(c => c.startsWith('年齡'));
  if (ageCatIdx >= 0) {
    const ageSlider = document.getElementById('ageSlider');
    if (ageSlider) {
      const ageVal = parseInt(ageSlider.value, 10);
      extraParts.push(`age_${ageVal}`);
    }
  }

  catNames.forEach((catName, ci) => {
    TAGS[catName].forEach((tagArr, ti) => {
      const st = state[key(ci, ti)];
      if (!st || !st.checked) return;
      const [fullLabel] = tagArr;
      const m = fullLabel.match(/\(([^)]+)\)/);
      if (!m) return;
      const tagName = m[1];
      let w = parseFloat(st.weight).toFixed(1);

      // Check preset weights for duplicate tags
      if (activePreset && PRESETS[Object.keys(PRESETS).find(k => PRESETS[k].positive === activePreset)]) {
        const pKey = Object.keys(PRESETS).find(k => PRESETS[k].positive === activePreset);
        const pw = PRESETS[pKey].weights;
        if (pw && pw[tagName] != null) {
          w = parseFloat(pw[tagName]).toFixed(1);
        }
      }

      extraParts.push(`${tagName}:${w}`);
    });
  });

  // Deduplicate: keep last occurrence of each tag
  const seen = new Set();
  const allParts = [...extraParts, ...baseParts].filter(p => {
    const cleanTag = p.split(':')[0].replace(/[()]/g, '');
    if (seen.has(cleanTag)) return false;
    seen.add(cleanTag);
    return true;
  });

  document.getElementById('promptArea').value = allParts.join(', ');
  const totalCount = allParts.length;
  document.getElementById('emptyMsg').style.display = totalCount ? 'none' : 'block';

  autoNegFromPos(allParts.join(', '));

  const btn = document.getElementById('genBtn');
  const orig = btn.textContent;
  btn.textContent = `✓ 已生成 ${totalCount} 個 tag`;
  setTimeout(() => { btn.textContent = orig; }, 1500);
}

// ── Copy / Clear ─────────────────────────────────────────────
async function copyPrompt() {
  const text = document.getElementById('promptArea').value;
  if (!text) return;
  try { await navigator.clipboard.writeText(text); } catch {
    document.getElementById('promptArea').select();
    document.execCommand('copy');
  }
  const btn = event.target;
  const orig = btn.textContent;

// ── Weight display for preset tags ──────────────────────────────
function applyTagWeights(presetTags, presetWeights) {
  // Remove old weight inputs if any
  const existing = document.getElementById('presetWeightPanel');
  if (existing) existing.remove();

  const selected = presetTags.split(',').map(t => t.trim().split(':')[0].trim()).filter(Boolean);
  const unique = [...new Set(selected)];
  if (!unique.length) return;

  const panel = document.createElement('div');
  panel.id = 'presetWeightPanel';
  panel.className = 'mt-2 p-3 bg-gray-50 rounded-lg border border-purple-200 text-xs';

  const title = document.createElement('div');
  title.className = 'font-semibold text-purple-600 mb-1';
  title.textContent = '⚖️ 內建組合標籤權重（可調整）';
  panel.appendChild(title);

  const list = document.createElement('div');
  list.className = 'flex flex-wrap gap-x-4 gap-y-1';

  unique.forEach(tag => {
    const wVal = getWeight(tag, presetWeights);
    const sp = document.createElement('span');
    sp.className = 'inline-flex items-center gap-1';
    sp.innerHTML = `<span class="font-mono text-gray-600">${tag}</span> `;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = '0.1';
    inp.max = '2.0';
    inp.step = '0.1';
    inp.value = wVal.toFixed(1);
    inp.className = 'w-14 border border-gray-300 rounded px-1 text-center font-mono text-xs bg-white';
    inp.oninput = () => {
      const nv = parseFloat(inp.value);
      if (!isNaN(nv) && nv >= 0.1 && nv <= 2.0) {
        sp.querySelector('.fw').textContent = nv.toFixed(1);
      }
    };
    sp.appendChild(inp);
    sp.appendChild(document.createTextNode(': '));
    const fw = document.createElement('span');
    fw.className = 'fw font-mono text-purple-600';
    fw.textContent = wVal.toFixed(1);
    sp.appendChild(fw);
    list.appendChild(sp);
  });

  panel.appendChild(list);
  document.querySelector('.sticky').insertBefore(panel, document.querySelector('.sticky > div'));
}

// ── Apply Preset Functions ──────────────────────────────────────
function applyPreset() {
  const sel = document.getElementById('presetSelect');
  const val = sel.value;
  if (!val || !PRESETS[val]) return;

  const preset = PRESETS[val];
  const area = document.getElementById('promptArea');
  area.value = preset.positive;
  activePreset = preset.positive;
  area.parentElement.style.display = 'block';
  document.getElementById('emptyMsg').style.display = 'none';

  // Set age from preset (default 10)
  const ageDefault = preset.age_default || 10;
  const ageSlider = document.getElementById('ageSlider');
  if (ageSlider) {
    ageSlider.value = ageDefault;
    document.getElementById('ageValue').textContent = ageDefault;
    document.getElementById('ageHint').textContent = `(age_${ageDefault})`;
  }

  const count = preset.positive.split(',').map(t => t.trim()).filter(t => t).length;
  document.getElementById('promptCount').textContent = `${preset.desc} (${count} 個 tag)`;

  sel.value = '';

  // Auto-fill negative prompt
  if (preset.neg) {
    const negArea = document.getElementById('negPromptArea');
    negArea.value = preset.neg;
    document.getElementById('negEmptyMsg').style.display = 'none';
    const nc = preset.neg.split(',').map(t => t.trim()).filter(t => t).length;
    document.getElementById('negCount').textContent = `${nc} 個負面 tag`;
  } else {
    autoNegFromPos(preset.positive);
  }

  // Apply weight UI for preset tags
  applyTagWeights(preset.positive, preset.weights);
}

  if (posText.includes('futanari') || posText.includes('hermaphrodite')) negParts.push('penis without hermaphrodite');
  if (posText.includes('cyberpunk')) negParts.push('fantasy, medieval, forest, sword, magic');
  if (posText.includes('armor') || posText.includes('fantasy')) negParts.push('sci-fi, cyberpunk, neon, futuristic, space');
  if (posText.includes('2girls') || posText.includes('2boys')) negParts.push('solo, single person, lone character');

  const negArea = document.getElementById('negPromptArea');
  negArea.value = negParts.join(', ');
  document.getElementById('negEmptyMsg').style.display = 'none';
  const nCount = negParts.join(', ').split(',').map(t => t.trim()).filter(t => t).length;
  document.getElementById('negCount').textContent = `${nCount} 個負面 tag`;
}

function generateNegPrompt() {
  const posText = document.getElementById('promptArea').value;
  if (!posText) {
    alert('請先生成正面 prompt，我會根據內容推薦負面標籤');
    return;
  }
  // Auto-generate: based on presence of certain tags, add appropriate negs
  const negParts = [];

  // Always include quality neg
  negParts.push('lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, cropped, worst quality, low quality');

  if (posText.includes('1boy') || posText.includes('2boys')) {
    negParts.push('extra arms on male, deformed male face');
  }
  if (posText.includes('loli') || posText.includes('child')) {
    negParts.push('mature female, old woman, wrinkled skin, gray hair');
  }
  if (posText.includes('shota')) {
    negParts.push('beard, mustache, hairy chest, muscular male, broad shoulders');
  }
  if (posText.includes('futanari') || posText.includes('hermaphrodite')) {
    negParts.push('penis without hermaphrodite');
  }
  if (posText.includes('cyberpunk')) {
    negParts.push('fantasy, medieval, forest, sword, magic');
  }
  if (posText.includes('armor') || posText.includes('fantasy')) {
    negParts.push('sci-fi, cyberpunk, neon, futuristic, space');
  }
  // Group sex
  if (posText.includes('2girls') || posText.includes('2boys')) {
    negParts.push('solo, single person, lone character');
  }

  document.getElementById('negPromptArea').value = negParts.join(', ');
  document.getElementById('negEmptyMsg').style.display = 'none';
  const count = negParts.join(', ').split(',').map(t => t.trim()).filter(t => t).length;
  document.getElementById('negCount').textContent = `${count} 個負面 tag`;

  // Visual feedback
  const btn = document.getElementById('genNegBtn');
  const orig = btn.textContent;
  btn.textContent = `✓ 已生成 ${count} 個負面 tag`;
  setTimeout(() => { btn.textContent = orig; }, 1500);
}

function applyNegPreset() {
  const sel = document.getElementById('negPresetSelect');
  const val = sel.value;
  if (!val || !NEG_PRESETS[val]) return;

  const preset = NEG_PRESETS[val];
  document.getElementById('negPromptArea').value = preset.neg;
  document.getElementById('negEmptyMsg').style.display = 'none';
  const count = preset.neg.split(',').map(t => t.trim()).filter(t => t).length;
  document.getElementById('negCount').textContent = `${count} 個負面 tag`;

  sel.value = '';
}

async function copyNegPrompt() {
  const text = document.getElementById('negPromptArea').value;
  if (!text) return;
  try { await navigator.clipboard.writeText(text); } catch {
    document.getElementById('negPromptArea').select();
    document.execCommand('copy');
  }
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = '✅ 已複製！';
  btn.classList.replace('bg-orange-500', 'bg-orange-600');
  setTimeout(() => { btn.textContent = orig; btn.classList.replace('bg-orange-600', 'bg-orange-500'); }, 1500);
}
