<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hermes">
<meta name="theme-color" content="#0d0f12">
<title>Hermes</title>
<style>
  /* 配色對齊 Hermes 桌面版：主色 #0053fd，深色底、卡片式訊息 */
  :root {
    --primary: #0053fd;
    --bg: #0d0f12;
    --chrome: #14171c;
    --card: #1a1e25;
    --border: #262b33;
    --text: #f0f1f3;
    --text-2: #a8aeb8;
    --text-3: #6b7280;
    --danger: #ef4444;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px;
    background: var(--chrome); border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: var(--primary); color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px; letter-spacing: -.5px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
  .state {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    flex: none; transition: background .2s;
  }
  .state.busy { background: #f59e0b; animation: pulse 1.1s ease-in-out infinite; }
  .state.err { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .25 } }
  header button {
    margin-left: auto; background: transparent;
    border: 1px solid var(--border); color: var(--text-2);
    border-radius: 8px; padding: 6px 13px; font-size: 13px;
    font-family: inherit; cursor: pointer;
  }
  header button:active { background: var(--card); }
  .icon.hdr {
    margin: 0; width: 32px; height: 32px; border-radius: 8px;
    background: transparent; border: none; color: var(--text-2);
    font-size: 17px; padding: 0;
  }

  #log { flex: 1; overflow-y: auto; padding: 20px 16px; -webkit-overflow-scrolling: touch; }
  .msg { margin-bottom: 18px; display: flex; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 88%; padding: 11px 15px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word;
    border: 1px solid transparent;
  }
  .me .bubble {
    background: var(--primary); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ai .bubble {
    background: var(--card); border-color: var(--border);
    border-bottom-left-radius: 4px;
  }
  .err .bubble {
    background: color-mix(in srgb, var(--danger) 12%, var(--card));
    border-color: color-mix(in srgb, var(--danger) 35%, transparent);
    color: #fca5a5;
  }
  .bubble img {
    max-width: 100%; border-radius: 9px; margin-bottom: 8px; display: block;
  }
  .bubble code {
    background: rgba(255,255,255,.08); padding: 2px 5px;
    border-radius: 4px; font-size: .9em;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .typing span {
    display: inline-block; width: 6px; height: 6px; margin-right: 5px;
    background: var(--text-3); border-radius: 50%;
    animation: blink 1.3s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: .18s }
  .typing span:nth-child(3) { animation-delay: .36s }
  @keyframes blink { 0%,65%,100% { opacity:.2 } 32% { opacity:1 } }

  #hint {
    color: var(--text-3); text-align: center;
    margin: 15vh 24px 0; font-size: 15px; line-height: 1.8;
  }
  .tip {
    color: var(--text-3); text-align: center; font-size: 13px;
    margin: 4px 20px 18px; line-height: 1.6;
  }

  /* 歷史側欄 */
  #mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 20;
  }
  #mask.on { opacity: 1; pointer-events: auto; }
  #side {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 84vw);
    background: var(--chrome); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .24s cubic-bezier(.32,.72,0,1);
    z-index: 21; display: flex; flex-direction: column;
  }
  #side.on { transform: none; }
  #side h2 {
    margin: 0; padding: max(16px, env(safe-area-inset-top)) 18px 14px;
    font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--border);
  }
  #chats { flex: 1; overflow-y: auto; padding: 8px; }
  .chat-item {
    padding: 11px 13px; border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .chat-item:active { background: var(--card); }
  .chat-item.cur { background: color-mix(in srgb, var(--primary) 18%, transparent); }
  .chat-item .t {
    flex: 1; min-width: 0; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-item .d {
    flex: none; color: var(--text-3); font-size: 17px; padding: 0 4px;
    background: none; border: none; cursor: pointer;
  }
  .chat-item .meta { display: block; color: var(--text-3); font-size: 11px; margin-top: 2px; }
  #chats .none { color: var(--text-3); font-size: 14px; text-align: center; padding: 30px 16px; }
  #hint b { display: block; color: var(--text-2); font-size: 17px; margin-bottom: 6px; }

  footer {
    flex: none; background: var(--chrome); border-top: 1px solid var(--border);
    padding: 11px 12px calc(11px + env(safe-area-inset-bottom));
  }
  #preview { display: none; margin-bottom: 9px; position: relative; width: fit-content; }
  #preview img { max-height: 88px; border-radius: 9px; display: block; border: 1px solid var(--border); }
  #preview button {
    position: absolute; top: 5px; left: 5px;
    background: rgba(0,0,0,.72); color: #fff; border: none;
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 14px; line-height: 1; cursor: pointer;
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 11px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-2); font-size: 18px; font-family: inherit;
    cursor: pointer; display: grid; place-items: center;
  }
  .icon:active { background: var(--border); }
  textarea {
    flex: 1; resize: none; max-height: 132px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 11px; color: var(--text);
    padding: 10px 13px; font: inherit; font-size: 16px;
  }
  textarea:focus { outline: none; border-color: var(--primary); }
  textarea::placeholder { color: var(--text-3); }
  #send {
    background: var(--primary); border-color: var(--primary); color: #fff;
    font-size: 17px; font-weight: 600;
  }
  #send:disabled { opacity: .35 }
</style>
</head>
<body>

<div id="mask"></div>
<aside id="side">
  <h2>對話紀錄</h2>
  <div id="chats"></div>
</aside>

<header>
  <button class="icon hdr" id="menu">☰</button>
  <div class="logo">H</div>
  <h1>Hermes</h1>
  <span class="state" id="state"></span>
  <button id="newchat">＋ 新對話</button>
</header>

<div id="log">
  <div id="hint"><b>有什麼可以幫你的？</b>問我任何事，也可以傳照片、貼網址給我看。</div>
</div>

<footer>
  <div id="preview"><button id="drop">×</button><img id="thumb" alt=""></div>
  <div class="row">
    <button class="icon" id="pick">＋</button>
    <textarea id="box" rows="1" placeholder="傳訊息給 Hermes…" enterkeyhint="send"></textarea>
    <button class="icon" id="send">↑</button>
  </div>
</footer>

<input type="file" id="file" accept="image/*" hidden>

<script>
const log = document.getElementById('log');
const box = document.getElementById('box');
const state = document.getElementById('state');
const file = document.getElementById('file');
const preview = document.getElementById('preview');
const thumb = document.getElementById('thumb');
const sendBtn = document.getElementById('send');

let history = [];
let pendingImage = null;
let busy = false;
let suggested = false;   // 「該開新對話了」的提示只出現一次

// 每支手機一個固定 ID，伺服器靠它分辨誰的對話
let device = localStorage.getItem('hermes_device');
if (!device) {
  device = 'd' + Math.random().toString(36).slice(2, 12);
  localStorage.setItem('hermes_device', device);
}
let chatId = localStorage.getItem('hermes_chat_id') || newId();

function newId() {
  const id = 'c' + Date.now().toString(36);
  localStorage.setItem('hermes_chat_id', id);
  return id;
}

async function save() {
  if (!history.length) return;
  try {
    await fetch('/api/simple/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device, id: chatId, messages: history })
    });
  } catch (e) {}
}

async function loadChats() {
  const box = document.getElementById('chats');
  try {
    const r = await fetch('/api/simple/list?device=' + device);
    const d = await r.json();
    box.innerHTML = '';
    if (!d.chats || !d.chats.length) {
      box.innerHTML = '<div class="none">還沒有對話紀錄</div>';
      return;
    }
    d.chats.forEach(c => {
      const row = document.createElement('div');
      row.className = 'chat-item' + (c.id === chatId ? ' cur' : '');
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = c.title;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = when(c.updated) + ' · ' + c.count + ' 則';
      t.appendChild(meta);
      t.onclick = () => openChat(c.id);
      const del = document.createElement('button');
      del.className = 'd';
      del.textContent = '×';
      del.onclick = async e => {
        e.stopPropagation();
        if (!confirm('刪除「' + c.title + '」？')) return;
        await fetch('/api/simple/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device, id: c.id })
        });
        if (c.id === chatId) startNew(true);
        loadChats();
      };
      row.appendChild(t);
      row.appendChild(del);
      box.appendChild(row);
    });
  } catch (e) {
    box.innerHTML = '<div class="none">讀不到紀錄</div>';
  }
}

function when(ts) {
  const s = (Date.now() / 1000) - ts;
  if (s < 3600) return Math.max(1, Math.floor(s / 60)) + ' 分鐘前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小時前';
  if (s < 604800) return Math.floor(s / 86400) + ' 天前';
  return new Date(ts * 1000).toLocaleDateString('zh-TW');
}

async function openChat(id) {
  if (busy) return;
  try {
    const r = await fetch('/api/simple/load?device=' + device + '&id=' + id);
    const d = await r.json();
    if (!d.ok) return;
    chatId = id;
    localStorage.setItem('hermes_chat_id', id);
    history = d.messages || [];
    log.innerHTML = '';
    history.forEach(m => draw(m.role === 'user' ? 'me' : 'ai', m.content));
    suggested = false;
    closeSide();
  } catch (e) {}
}

function startNew(silent) {
  history = [];
  chatId = newId();
  suggested = false;
  log.innerHTML = '<div id="hint"><b>有什麼可以幫你的？</b>問我任何事，也可以傳照片、貼網址給我看。</div>';
  if (!silent) closeSide();
}

// 開場：把上次那段接回來
openChat(chatId);

// 只處理 `code` 這種最常見的標記，其餘原樣顯示（避免 XSS 又保留可讀性）
function render(el, text) {
  const parts = String(text).split(/(`[^`\n]+`)/g);
  parts.forEach(p => {
    if (p.startsWith('`') && p.endsWith('`') && p.length > 2) {
      const c = document.createElement('code');
      c.textContent = p.slice(1, -1);
      el.appendChild(c);
    } else if (p) {
      el.appendChild(document.createTextNode(p));
    }
  });
}

function draw(cls, text, imgSrc) {
  document.getElementById('hint')?.remove();
  const row = document.createElement('div');
  row.className = 'msg ' + cls;
  const b = document.createElement('div');
  b.className = 'bubble';
  if (imgSrc) {
    const im = document.createElement('img');
    im.src = imgSrc;
    b.appendChild(im);
  }
  if (text) render(b, text);
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

// 對話太長會變慢（每次都要重讀全部內容），提醒一次就好
function maybeSuggestNew() {
  if (suggested || history.length < 24) return;
  suggested = true;
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.textContent = '聊了一陣子了。換個話題的話，按右上角「＋ 新對話」會比較快。';
  log.appendChild(tip);
  log.scrollTop = log.scrollHeight;
}

function thinking() {
  const row = document.createElement('div');
  row.className = 'msg ai';
  row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

box.addEventListener('input', () => {
  box.style.height = 'auto';
  box.style.height = Math.min(box.scrollHeight, 132) + 'px';
});

box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.getElementById('pick').onclick = () => file.click();

file.onchange = () => {
  const f = file.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    pendingImage = r.result;
    thumb.src = r.result;
    preview.style.display = 'block';
  };
  r.readAsDataURL(f);
  file.value = '';
};

document.getElementById('drop').onclick = () => {
  pendingImage = null;
  preview.style.display = 'none';
};

document.getElementById('newchat').onclick = () => {
  if (busy) return;
  startNew();
  box.focus();
};

const side = document.getElementById('side');
const mask = document.getElementById('mask');
function closeSide() { side.classList.remove('on'); mask.classList.remove('on'); }
document.getElementById('menu').onclick = () => {
  side.classList.add('on');
  mask.classList.add('on');
  loadChats();
};
mask.onclick = closeSide;

sendBtn.onclick = send;

async function send() {
  const text = box.value.trim();
  if ((!text && !pendingImage) || busy) return;

  busy = true;
  sendBtn.disabled = true;
  state.className = 'state busy';

  const img = pendingImage;
  draw('me', text, img);
  box.value = '';
  box.style.height = 'auto';
  pendingImage = null;
  preview.style.display = 'none';

  history.push({ role: 'user', content: text || '（這張圖片是什麼？）' });
  save();

  const wait = thinking();

  try {
    // 本地模型一次要 90-220 秒，手機瀏覽器約 60 秒就切斷連線，
    // 會誤判成「連不上伺服器」。所以改成：後端立刻回 job_id，這裡輪詢。
    const res = await fetch('/api/simple/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, image_base64: img })
    });
    let data = await res.json();

    if (data.ok && data.job_id) {
      const started = Date.now();
      while (true) {
        await new Promise(r => setTimeout(r, 3000));
        if (Date.now() - started > 15 * 60 * 1000) {   // 15 分鐘還沒好就放棄
          data = { ok: false, error: '等太久了，請再試一次' };
          break;
        }
        let p;
        try {
          const pr = await fetch('/api/simple/poll?job_id=' + data.job_id);
          p = await pr.json();
        } catch (e) {
          continue;      // 網路瞬斷不要放棄，下一輪再問
        }
        if (p.status === 'pending') {
          // 本地模型一步就要一兩分鐘，把目前在做什麼寫出來，
          // 不然使用者會以為當掉了。
          const el = wait.querySelector('.bubble');
          if (el && p.step) {
            const sec = p.elapsed || 0;
            el.classList.remove('typing');
            el.textContent = p.step + '（' + sec + ' 秒）';
          }
          continue;
        }
        data = p.status === 'done'
          ? { ok: true, reply: p.reply }
          : { ok: false, error: p.error || '出了點問題' };
        break;
      }
    }
    wait.remove();

    if (data.ok) {
      draw('ai', data.reply);
      history.push({ role: 'assistant', content: data.reply });
      save();
      state.className = 'state';
      maybeSuggestNew();
    } else {
      draw('err', data.error || '出了點問題，請再試一次');
      state.className = 'state err';
    }
  } catch (e) {
    wait.remove();
    draw('err', '連不上伺服器，請確認 ZeroTier 有開');
    state.className = 'state err';
  }

  busy = false;
  sendBtn.disabled = false;
}
</script>
</body>
</html>
